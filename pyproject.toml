[project]
name = "ai-project-planning-server"
version = "0.1.0"
description = "Postgres-backed hosted planning tree for agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
]

[project.scripts]
ai-project-planning-server = "ai_project_planning_server.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests", "ai_project_planning_server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_project_planning_server"]
