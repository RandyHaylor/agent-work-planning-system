[project]
name = "ai-project-planning-server"
version = "0.1.0"
description = "Postgres-backed hosted planning tree for agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "lxml_html_clean",
    "readabilipy>=0.3",
    "markdownify>=1.1",
    "pypdf>=5",
    "pdfminer.six",
    "charset-normalizer>=3",
    "python-docx>=1.1",
    "json-source-map>=1.0.5",
    "pysbd>=0.3.4",
]

[project.scripts]
ai-project-planning-server = "ai_project_planning_server.__main__:main"
planning-server = "planning_system.main:main"
planning = "planning_system.cli.entry_point:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "import-linter>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests", "ai_project_planning_server"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_project_planning_server", "planning_system"]

# Module boundaries (modularity review 2026-11-27, fix 2). Run: uv run --extra test lint-imports
# (also run by tests/planning_system/test_import_contracts.py). Each domain package is imported only
# through its __init__; `fakes` (test support) and references.http_routes (mounted by config) are the
# allowed submodules.
[tool.importlinter]
root_packages = ["planning_system"]

[[tool.importlinter.contracts]]
name = "domain.access is imported only through its package"
type = "forbidden"
source_modules = ["planning_system.server.commands", "planning_system.server.http_api", "planning_system.server.storage", "planning_system.server.adapters", "planning_system.server.bootstrap", "planning_system.server.composition", "planning_system.server.domain.agent_registry", "planning_system.server.domain.authentication", "planning_system.server.domain.citation_enforcement", "planning_system.server.domain.content_review", "planning_system.server.domain.context_assembly", "planning_system.server.domain.project_tree", "planning_system.server.domain.references", "planning_system.server.domain.task_assignment"]
forbidden_modules = ["planning_system.server.domain.access.interface", "planning_system.server.domain.access.permission_policy", "planning_system.server.domain.access.principal", "planning_system.server.domain.access.types"]
allow_indirect_imports = true

