[project]
name = "ai-project-planning-server"
version = "0.1.0"
description = "Postgres-backed hosted planning tree for agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "lxml_html_clean",
    "readabilipy>=0.3",
    "markdownify>=1.1",
    "pypdf>=5",
    "pdfminer.six",
    "charset-normalizer>=3",
    "python-docx>=1.1",
    "json-source-map>=1.0.5",
]

[project.scripts]
ai-project-planning-server = "ai_project_planning_server.__main__:main"
planning-server = "planning_system.main:main"
planning = "planning_system.cli.entry_point:main"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests", "ai_project_planning_server"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_project_planning_server", "planning_system"]
