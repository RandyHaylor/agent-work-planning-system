services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${PLANNER_DB_PASSWORD:?run `uv run python -m server init-env` first}
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:${PLANNER_DB_PORT:-5433}:5432"
    volumes:
      - planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  planner_pgdata:
